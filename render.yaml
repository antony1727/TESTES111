# render.yaml — Blueprint para deploy GRATUITO no Render (sem cartão).
# ----------------------------------------------------------------------------
# COMO USAR (5 minutos, grátis e SEM perder agendamentos):
#  1. Crie o banco grátis no Neon (https://neon.tech) e copie a connection string.
#  2. Abra https://render.com/deploy?repo=https://github.com/antony1727/TESTES111
#  3. Dê "Apply" e, quando pedir DATABASE_URL, cole a string do Neon.
#  4. Resultado: https://barbercode.onrender.com (com o nome!) + /admin
#
# POR QUE NEON? O disco do plano free do Render é TEMPORÁRIO (os agendamentos
# seriam apagados a cada restart). Com o Postgres do Neon (também grátis) os
# dados ficam guardados de verdade. O keepalive.yml impede o serviço de dormir.
# ----------------------------------------------------------------------------
services:
  # Serviço web único: backend (API) + frontend (arquivos public/) juntos.
  - type: web
    name: barbercode # → este nome vira a URL: https://barbercode.onrender.com
    runtime: node
    plan: free # → plano 100% grátis
    buildCommand: npm install # instala as dependências
    startCommand: npm start # sobe o Express (usa a PORT que o Render injeta)
    healthCheckPath: /api/health # sonda que prova que o app está vivo
    envVars:
      # Postgres hospedado (Neon). O Render pergunta o valor no primeiro deploy.
      - key: DATABASE_URL
        sync: false
      # Em produção o app exige DATABASE_URL (não sobe com banco temporário).
      - key: NODE_ENV
        value: production
      # Segredo do JWT gerado automaticamente pelo Render (não se preocupe).
      - key: JWT_SECRET
        generateValue: true
      # Validade do login no painel.
      - key: JWT_EXPIRES_IN
        value: 12h
      # Conta inicial do painel /admin (troque a senha depois do 1º login
      # recriando a variável ADMIN_PASSWORD e dando "Manual Deploy").
      - key: ADMIN_EMAIL
        value: admin@barbercode.app
      - key: ADMIN_PASSWORD
        value: admin123
      # WhatsApp da barbearia (só dígitos DDI+DDD+número). Vazio = botão usa wa.me genérico.
      - key: BARBER_WHATSAPP
        value: ""
