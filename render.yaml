# render.yaml — Blueprint para deploy GRATUITO no Render (sem cartão).
# ----------------------------------------------------------------------------
# COMO USAR (2 minutos, grátis):
#  1. Suba este repositório no GitHub (já está: TESTES111).
#  2. Acesse https://dashboard.render.com → New → Blueprint → selecione o repo.
#  3. O Render lê este arquivo e cria o serviço "barbercode" no plano FREE.
#  4. Resultado: site público em https://barbercode.onrender.com (com o nome!).
#
# NOTAS DO PLANO GRÁTIS (só para TESTE — é o que você quer agora):
#  • O serviço "dorme" após ~15 min sem acesso; o 1º clique demora ~1 min p/ acordar.
#  • O disco é EFÊMERO: a cada redeploy/restart o banco SQLite zera e o seed
#    recria tudo (admin + serviços de exemplo). Para teste está ótimo.
#  • 750h/mês grátis = suficiente para 1 serviço ligado o mês todo.
# ----------------------------------------------------------------------------
services:
  # Serviço web único: backend (API) + frontend (arquivos public/) juntos.
  - type: web
    name: barbercode # ← este nome vira a URL: https://barbercode.onrender.com
    runtime: node
    plan: free # ← plano 100% grátis
    buildCommand: npm install # instala as dependências
    startCommand: npm start # sobe o Express (usa a PORT que o Render injeta)
    healthCheckPath: /api/health # sonda que prova que o app está vivo
    envVars:
      # Segredo do JWT gerado automaticamente pelo Render (não se preocupe).
      - key: JWT_SECRET
        generateValue: true
      # Validade do login no painel.
      - key: JWT_EXPIRES_IN
        value: 12h
      # Conta inicial do painel /admin (troque a senha depois do 1º login
      # recriando a variável ADMIN_PASSWORD e dando "Manual Deploy").
      - key: ADMIN_EMAIL
        value: admin@barbercode.app
      - key: ADMIN_PASSWORD
        value: admin123
      # WhatsApp da barbearia (só dígitos DDI+DDD+número). Vazio = botão usa wa.me genérico.
      - key: BARBER_WHATSAPP
        value: ""
